variables:
    # Faster artifact zipping and upload; the editor build is large
    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: fast

# Pipelines run for merge requests and for pushes to master and release. Other
# branches only get one once they open a merge request, so a push never runs
# twice, and the tags the release job creates don't start pipelines of their own
workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release"

stages:
    - test
    - build
    - release

# Runs in every pipeline
run_tests:
    stage: test
    image: "python:3.12.10"
    interruptible: true
    variables:
        PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    cache:
        key:
            files:
                - requirements_test.txt
                - requirements_editor.txt
        paths:
            - .cache/pip
    before_script:
        - apt-get update
        - apt-get install -y --no-install-recommends libgl1
        - python --version
        - pip install -r requirements_test.txt
    script:
        - echo "Running tests"
        - python -m app.engine.codegen.source_generator
        - python -m unittest discover -s app/tests -p 'test*.py'

build_web:
    stage: test
    image: "python:3.12.10"
    interruptible: true
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "master"
    before_script:
        - python --version
    script:
        - echo "Building default.ltproj for the browser"
        - python utilities/build_tools/build_web.py default.ltproj
    artifacts:
        name: "LT Web Build"
        # Links the build from the merge request page
        expose_as: "Web build"
        paths:
            - build/web/default/
        expire_in: 1 week

# The three Windows builds are independent, so they all start as soon as the
# pipeline does; only the release job waits on them and on the tests
.windows_build:
    stage: build
    tags:
    - saas-windows-medium-amd64
    needs: []
    rules:
        - if: $CI_COMMIT_BRANCH == "release"
    variables:
        PYTHON: 'C:\nuget\python\tools\python.exe'
    before_script:
        # Progress bars make Invoke-WebRequest many times slower
        - $ProgressPreference = 'SilentlyContinue'
        # The python nuget package is a ready-made Python that only needs unzipping,
        # much faster than chocolatey running the full installer. Keep the path short:
        # PyQt5's deepest files go past Windows' 260 character limit otherwise
        - Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
        - .\nuget.exe install python -Version 3.12.10 -ExcludeVersion -OutputDirectory C:\nuget
        # Necessary to use setuptools < 70 until we upgrade to Pyinstaller v6.7.0
        - '& $env:PYTHON -m pip install -r $env:REQUIREMENTS pywin32 "setuptools<70"'
        - echo "Prereqs successfully installed"

build_engine:
    extends: .windows_build
    variables:
        REQUIREMENTS: requirements_engine.txt
    script:
        - echo "Generating component files"
        - '& $env:PYTHON -m app.engine.codegen.source_generator'
        - echo "Building generic engine..."
        - cp ./utilities/build_tools/generic_engine.spec .
        - '& $env:PYTHON -m PyInstaller -y generic_engine.spec'
        - rm generic_engine.spec -fo
        - mkdir lt_engine
        - mv dist/lt_engine ./lt_engine/lt_engine
        - cp utilities/install/double_click_to_play.bat ./lt_engine
        - echo $CI_COMMIT_SHORT_SHA > ./lt_engine/lt_engine/version.txt
        - echo "Done!"
    artifacts:
        name: "LT Engine"
        paths:
            - lt_engine/
        expire_in: 3 mos

build_editor:
    extends: .windows_build
    variables:
        REQUIREMENTS: requirements_editor.txt
    script:
        - echo "Generating component files"
        - '& $env:PYTHON -m app.engine.codegen.source_generator'
        - echo "Now building main editor..."
        - cp ./utilities/build_tools/editor.spec .
        - '& $env:PYTHON -m PyInstaller -y editor.spec'
        - rm editor.spec -fo
        - mkdir lt_editor
        - mv dist/lt_editor ./lt_editor/lt_editor
        - cp utilities/install/double_click_to_run.bat ./lt_editor
        - echo "Copying default lt project..."
        - cp default.ltproj ./lt_editor/lt_editor -r
        - echo $CI_COMMIT_SHORT_SHA > ./lt_editor/lt_editor/version.txt
        - echo "Done!"
    artifacts:
        name: "LT Editor"
        paths:
            - lt_editor/
        expire_in: 3 mos

build_map_maker:
    extends: .windows_build
    variables:
        REQUIREMENTS: requirements_editor.txt
    script:
        - echo "Building map maker..."
        - cp ./utilities/build_tools/map_maker.spec .
        - '& $env:PYTHON -m PyInstaller -y map_maker.spec'
        - rm map_maker.spec -fo
        - mkdir lt_map_maker
        - mv dist/lt_map_maker ./lt_map_maker/lt_map_maker
        - cp utilities/install/double_click_to_run.bat ./lt_map_maker
        - echo $CI_COMMIT_SHORT_SHA > ./lt_map_maker/lt_map_maker/version.txt
        - echo "Done!"
    artifacts:
        name: "LT Map Maker"
        paths:
            - lt_map_maker/
        expire_in: 3 mos

release:
    stage: release
    # The release keyword runs glab from this image; release-cli is deprecated
    image: registry.gitlab.com/gitlab-org/cli:latest
    # The release only links to the build artifacts, so it doesn't download them
    needs:
    - job: run_tests
      artifacts: false
    - job: build_editor
      artifacts: false
    - job: build_engine
      artifacts: false
    - job: build_map_maker
      artifacts: false
    rules:
        - if: $CI_COMMIT_BRANCH == "release"
    script:
        - echo 'running release'
        - echo 'remember to make sure your url is correct!'
    release:
        name: 'Release Executables $CI_COMMIT_SHORT_SHA'
        description: 'Download Lex_Talionis_Maker from the Packages header to use the editor! Once the download is extracted run double_click_to_run.bat to open the editor.'
        tag_name: '$CI_COMMIT_SHORT_SHA'
        assets:
            links: # IF SOMETHING IS BROKEN, IT'S PROBABLY THESE URLS FAULT
                - name: 'Lex_Talionis_Maker'
                  filepath: /lex_talionis_maker
                  url: "https://gitlab.com/rainlash/lt-maker/-/jobs/artifacts/release/download?job=build_editor"
                  link_type: package
                - name: 'Lex_Talionis_Engine'
                  filepath: /lex_talionis_engine
                  url: "https://gitlab.com/rainlash/lt-maker/-/jobs/artifacts/release/download?job=build_engine"
                  link_type: package
                - name: 'Lex_Talionis_Map_Maker'
                  filepath: /lex_talionis_map_maker
                  url: "https://gitlab.com/rainlash/lt-maker/-/jobs/artifacts/release/download?job=build_map_maker"
                  link_type: package
